# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#
# Los @argfiles de los workers (p. ej. la classpath de los tests,
# gradle-worker-classpath*.txt) se escriben con la codificación NATIVA de la
# plataforma gracias al parche local de tools/gradle-argwriter-patch
# (ArgWriter.java): el launcher de `java` que los lee usa sun.jnu.encoding
# (Cp1252 en Windows), NO file.encoding. Sin el parche, con file.encoding=UTF-8
# (default desde JEP 400) y la "é" de C:\Users\Andrés\ los workers mueren con
# "ClassNotFoundException: worker.org.gradle.process.internal.worker.GradleWorkerMain"
# (gradle/gradle#29303 y gradle/gradle#30304).
# NO fijar file.encoding=Cp1252: rompe los lectores de AGP que decodifican con
# defaultCharset los ficheros UTF-8 con acentos (metadatos de CMake: la ruta
# "Andrés" se leía como "AndrÃ©s" y ninja.exe fallaba con CreateProcess error=2).
# Tras cada actualización de Gradle hay que re-aplicar el parche:
#   powershell -ExecutionPolicy Bypass -File tools\gradle-argwriter-patch\apply-patch.ps1
# La codificación de las fuentes NO depende de esto: javac lleva
# options.encoding="UTF-8" explícito (app/build.gradle.kts) y el compilador de
# Kotlin lee los .kt como UTF-8.
org.gradle.jvmargs=-Xmx4g
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Set the maximum number of workers to 4 to avoid overloading the machine.
org.gradle.workers.max=4
# La ruta del proyecto contiene una "é" (C:\Users\Andrés\...). AGP lo rechaza
# por defecto en Windows porque algunas herramientas nativas del build asumen
# rutas ASCII; el motor y el resto del proyecto compilan igual con este flag.
android.overridePathCheck=true
# Set the Kotlin compiler execution strategy to in-process to avoid "Could not
# connect to Kotlin compile daemon" error.
kotlin.compiler.execution.strategy=in-process
# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
